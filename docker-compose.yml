services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: graft
      POSTGRES_PASSWORD: graft
      POSTGRES_DB: graft
    ports:
      - "5432:5432"
    volumes:
      - graft_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graft"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: ./server
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  graft_db:
