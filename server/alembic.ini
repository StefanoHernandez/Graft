[alembic]
script_location = migrations
# Left empty on purpose: env.py falls back to DATABASE_URL (settings) when a
# caller has not set an explicit url, so a tool can target another database.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
